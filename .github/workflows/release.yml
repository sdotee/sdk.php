name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate release version
        run: |
          sdk_version="$(php -r 'require "vendor/autoload.php"; echo See\Client::VERSION;')"
          if [ "${GITHUB_REF_NAME}" != "v${sdk_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match SDK version v${sdk_version}."
            exit 1
          fi

      - name: Run tests
        run: composer test

      - name: Validate package
        run: |
          composer validate --strict
          composer audit --locked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
