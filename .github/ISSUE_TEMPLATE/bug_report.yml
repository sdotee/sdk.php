name: Bug report
description: Report reproducible SDK behavior that differs from the API contract.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please remove API keys, tokens, and other sensitive data from examples and logs.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.3.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      render: php
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      render: shell
