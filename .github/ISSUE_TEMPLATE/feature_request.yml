name: Feature request
description: Suggest an SDK API or workflow improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What SDK workflow or API operation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Include a PHP usage example when possible.
      render: php
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
